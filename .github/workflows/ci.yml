name: CI

# Runs on master, on every release branch and on every pull request, so a release
# branch is green before its pull request to master is opened. Every job has a time
# limit: a test that hangs fails within minutes instead of holding a runner for the
# six hours GitHub allows. RELEASING.md describes the release flow these checks gate.

on:
  push:
    branches: [master, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash with -e and -o pipefail, so a failing command before a pipe fails the step
    shell: bash

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-26.04  # pinned: GCC's floating-point contraction and the byte-for-byte golden fixtures depend on the toolchain
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Python unittest suites
        run: make test-python

  go:
    name: Go tests
    runs-on: ubuntu-26.04  # pinned: GCC's floating-point contraction and the byte-for-byte golden fixtures depend on the toolchain
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Run go test across all modules
        run: make test-go

  cpp:
    name: C++ tests
    runs-on: ubuntu-26.04  # pinned: GCC's floating-point contraction and the byte-for-byte golden fixtures depend on the toolchain
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compile and run all C++ test binaries
        run: make test-cpp

  cpp-sanitizers:
    name: C++ tests under ASan and UBSan
    runs-on: ubuntu-26.04  # pinned: GCC's floating-point contraction and the byte-for-byte golden fixtures depend on the toolchain
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      # Out-of-bounds access, use after free and undefined behaviour abort the test.
      # Leak detection is off for now: it is the one check not yet run on every test.
      - name: Compile and run all C++ test binaries with sanitizers
        env:
          CXXFLAGS: -std=c++17 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -DIS_TEST_BUILD
          ASAN_OPTIONS: detect_leaks=0
        run: make test-cpp

  docs:
    name: READMEs follow the templates
    runs-on: ubuntu-26.04  # pinned: GCC's floating-point contraction and the byte-for-byte golden fixtures depend on the toolchain
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Topic, language and category READMEs: required sections, no emoji, and for a
      # category a link to every sub-folder and only links that resolve.
      - name: Check every README
        run: python3 scripts/check_readme_style.py --all

  web:
    name: Web visualizer
    runs-on: ubuntu-26.04  # pinned: GCC's floating-point contraction and the byte-for-byte golden fixtures depend on the toolchain
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # TypeScript ports must agree with the Python reference implementations;
      # regenerating every golden fixture must not change any of them.
      - name: Golden fixtures match the Python implementations
        run: |
          for script in web/scripts/gen_*_fixtures.py; do python3 "$script"; done
          git diff --exit-code -- web/src/viz/algorithms/__fixtures__

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Type check
        working-directory: web
        run: npm run check

      # The site renders the READMEs and reports each link it cannot resolve; a
      # report fails the build here instead of shipping a dead link.
      - name: Build, with no broken links
        working-directory: web
        run: |
          npm run build 2>&1 | tee build.log
          if grep -q '\[broken-link\]' build.log; then
            echo "::error::the rendered READMEs have broken links"
            grep '\[broken-link\]' build.log
            exit 1
          fi
